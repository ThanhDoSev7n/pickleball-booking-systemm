services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--innodb-lock-wait-timeout=10", "--default-time-zone=+07:00"]
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pickleball_booking}
      MYSQL_USER: ${DB_USERNAME:-pickleball}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/${GHCR_REPO:?Set GHCR_REPO}-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Asia/Ho_Chi_Minh
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-pickleball}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE:-pickleball_booking}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN}
    ports:
      - "${BACKEND_PORT:-3000}:3000"

  frontend:
    image: ${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/${GHCR_REPO:?Set GHCR_REPO}-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:3001"

volumes:
  mysql_data:
